# Netlify — статический фронтенд (PWA)
[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

# SPA-роутинг: все несуществующие пути → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
